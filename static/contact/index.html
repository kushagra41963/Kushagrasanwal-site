  .btn-primary {

  }
  .btn-secondary {
    background: #ffffff;
    color: #111111;
    border: 1.5px solid #111111;
  }
  .section-label {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #888;
    margin: 22px 0 8px;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row a.btn {
    flex: 1;
    padding: 12px 8px;
    font-size: 13px;
  }
  .links {
    margin-top: 26px;
    font-size: 13px;
  }
  .links a {
    color: #555;
    text-decoration: none;
    margin: 0 8px;
  }
  .links a:hover { color: var(--accent); }

</head>
